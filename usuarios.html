<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>População de Usuários | SEMUS Blumenau</title>
    <link rel="icon" href="assets/brasao.png">
    <link rel="stylesheet" href="portal.css">
    <link rel="stylesheet" href="pronto.css">
    <link rel="stylesheet" href="usuarios.css">
</head>

<body class="dashboard">
    <a class="pular" href="#conteudo">Ir para o conteúdo</a>

    <main id="conteudo" class="usuarios-app">
        <nav class="voltar" aria-label="Navegação">
            <a href="index.html" aria-label="Voltar aos painéis" title="Voltar aos painéis">⮐</a>
        </nav>

        <section class="barra-filtros card" aria-label="Filtros">
            <label>Unidade
                <select id="filtro-unidade">
                    <option value="">Todas</option>
                </select>
            </label>
            <label>Condição
                <select id="filtro-condicao">
                    <option value="">Todas</option>
                </select>
            </label>
            <label>Faixa etária
                <select id="filtro-faixa">
                    <option value="">Todas</option>
                </select>
            </label>
            <button id="limpar-filtros" type="button">Limpar filtros</button>
            <button id="baixar-excel" type="button">Baixar Excel</button>
        </section>

        <section class="linha-kpis" aria-label="Indicadores">
            <article class="kpi card">
                <h2>População Cadastrada</h2>
                <strong id="total-cadastrados">48.620</strong>
                <p>Usuários diferentes</p>
            </article>
            <article class="kpi card">
                <h2>População com Condições Monitoradas</h2>
                <strong id="total-condicoes">21.420</strong>
                <p>Com pelo menos uma condição ou fator</p>
            </article>
        </section>

        <div class="painel-grid">
            <div class="coluna-graficos">
                <section class="grafico card">
                    <h2>Condições Clínicas e Fatores de Risco</h2>
                    <div id="grafico-condicoes"></div>
                </section>
                <section class="grafico card">
                    <h2>Distribuição por Faixa Etária</h2>
                    <div id="grafico-faixas"></div>
                </section>
            </div>

            <section class="lista card">
                <h2>População Estratificada</h2>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Idade</th>
                            <th>Condições</th>
                        </tr>
                    </thead>
                    <tbody id="lista-cidadaos"></tbody>
                </table>

                <nav class="paginacao" aria-label="Paginação da população">
                    <button id="pagina-anterior" type="button" disabled>Anterior</button>
                    <span id="pagina-status">Página 1</span>
                    <button id="pagina-proxima" type="button">Próxima</button>
                </nav>

            </section>
        </div>
    </main>
    <script src="usuarios.js"></script>
</body>

</html>
